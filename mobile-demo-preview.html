<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111114">
<title>Prueba móvil · IA para Docentes</title>
<style>
  *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(60% 45% at 50% 0%,rgba(255,138,0,.16),transparent 72%),#111114;color:#f4f4f5;font-family:Inter,system-ui,sans-serif}
  .shell{width:min(100% - 28px,980px);margin:0 auto;padding:26px 0 38px}.head{display:flex;align-items:end;justify-content:space-between;gap:24px;flex-wrap:wrap}.eyebrow{color:#ff9d2e;font-size:11px;font-weight:900;letter-spacing:1.8px;text-transform:uppercase}h1{margin:5px 0 0;font-size:26px;line-height:1.1}.head p{max-width:500px;margin:0;color:#a9a9b2;font-size:14px;line-height:1.55}
  .switcher{display:flex;gap:8px;margin:20px 0 16px;flex-wrap:wrap}.switcher a{min-height:44px;display:flex;align-items:center;padding:9px 15px;border:1px solid #33333a;border-radius:999px;background:#1b1b1f;color:#e8e8ec;text-decoration:none;font-size:13px;font-weight:800}.switcher a.is-active{border-color:rgba(255,138,0,.5);background:rgba(255,138,0,.1);color:#ff9d2e}
  .stage{display:grid;place-items:center;padding:24px;border:1px solid #2b2b31;border-radius:26px;background:#171719;box-shadow:0 28px 90px rgba(0,0,0,.35)}.phone{width:410px;max-width:100%;padding:9px;border:1px solid #414148;border-radius:34px;background:#09090b;box-shadow:0 24px 70px rgba(0,0,0,.55)}.speaker{width:74px;height:5px;margin:1px auto 8px;border-radius:5px;background:#34343a}.phone iframe{display:block;width:100%;height:844px;border:0;border-radius:24px;background:#18181a}
  .note{margin-top:14px;color:#888892;font-size:12px;text-align:center}
  @media(max-width:520px){.shell{width:100%;padding:0}.head,.switcher,.note{display:none}.stage{padding:0;border:0;border-radius:0}.phone{width:100%;padding:0;border:0;border-radius:0}.speaker{display:none}.phone iframe{height:100dvh;border-radius:0}}
</style>
</head>
<body>
<main class="shell">
  <header class="head"><div><span class="eyebrow">Prototipo aislado</span><h1>Experiencia móvil</h1></div><p>Simulación de un teléfono de 390 × 844 px. Las páginas originales del portal permanecen sin cambios.</p></header>
  <nav class="switcher" aria-label="Seleccionar página de prueba">
    <a class="is-active" data-preview href="academia-docente-jalisco-mobile-demo.html?v=20260821-7">Portada</a>
    <a data-preview href="gemas-mobile-demo.html?v=20260821-7">Kit de herramientas</a>
    <a id="openPreview" href="academia-docente-jalisco-mobile-demo.html?v=20260821-7" target="_blank" rel="noopener">Abrir en una pestaña ↗</a>
  </nav>
  <section class="stage" aria-label="Vista previa del teléfono">
    <div class="phone"><div class="speaker" aria-hidden="true"></div><iframe name="mobilePreview" title="Vista previa móvil del portal" src="academia-docente-jalisco-mobile-demo.html?v=20260821-7"></iframe></div>
  </section>
  <p class="note">Usa los botones superiores para alternar entre la portada y el Kit de herramientas.</p>
</main>
<script>
(function(){
  var frame=document.querySelector('iframe[name="mobilePreview"]');
  var openLink=document.getElementById('openPreview');
  document.querySelectorAll('[data-preview]').forEach(function(link){
    link.addEventListener('click',function(event){
      event.preventDefault();
      document.querySelectorAll('[data-preview]').forEach(function(item){item.classList.remove('is-active');});
      link.classList.add('is-active');
      frame.src=link.getAttribute('href');
      openLink.href=link.getAttribute('href');
    });
  });
})();
</script>
</body>
</html>
