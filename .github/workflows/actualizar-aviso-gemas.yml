name: Actualizar referencias del aviso de Gemas

on:
  push:
    paths:
      - .github/workflows/actualizar-aviso-gemas.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v5

      - name: Renovar la versión del script en todas las páginas
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          replacement = 'gem-model-notice.js?v=20260911-criterio-docente-2'
          changed = []

          for path in Path('.').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              updated = re.sub(
                  r'gem-model-notice\.js(?:\?v=[^"\']+)?',
                  replacement,
                  text,
              )
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          print('Archivos actualizados:')
          for item in changed:
              print('-', item)
          PY

      - name: Guardar cambios
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No se encontraron referencias pendientes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          git commit -m "fix: renovar caché del aviso de Gemas en todas las páginas"
          git push
