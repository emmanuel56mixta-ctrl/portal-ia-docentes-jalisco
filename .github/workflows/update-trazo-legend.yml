name: Integrar leyenda final de Trazo

on:
  push:
    paths:
      - '.github/workflows/update-trazo-legend.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrar-footer:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Integrar leyenda solicitada
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('trazo-laboratorio.html')
          text = path.read_text(encoding='utf-8')

          old_title = '<div><b style="color:var(--ink-soft)">Trazo · Herramienta educativa interactiva</b></div>'
          old_author = '<div>Desarrollo independiente © 2026 Emmanuel Elizondo. Uso educativo gratuito y no comercial.</div>'
          old_geo = '<div>Made with <a href="https://www.geogebra.org/" target="_blank" rel="noopener noreferrer" style="color:var(--accent);text-decoration:none;font-weight:600;">GeoGebra®</a>. GeoGebra es una marca de GeoGebra GmbH.</div>'
          engine = '<div style="margin-top:5px;max-width:820px;margin-left:auto;margin-right:auto;">Trazo utiliza GeoGebra como motor matemático interactivo. Las construcciones, consignas, organización pedagógica, interfaz y contenidos originales de Trazo son independientes de GeoGebra. No se comercializa esta aplicación ni se cobra por su acceso.</div>'

          if text.count(old_title) != 1:
              raise SystemExit('No se encontró exactamente un título original de Trazo.')
          if text.count(old_author) != 1:
              raise SystemExit('No se encontró exactamente una leyenda de autoría original.')
          if text.count(old_geo) != 1:
              raise SystemExit('No se encontró exactamente una leyenda GeoGebra original.')
          if text.count(engine) != 1:
              raise SystemExit('No se encontró exactamente una leyenda de motor GeoGebra.')
          if text.count('id="trazo-legal"') != 1:
              raise SystemExit('No se encontró exactamente el bloque temporal duplicado.')

          # Elimina exclusivamente el bloque temporal duplicado del parche anterior.
          text, removed = re.subn(
              r'\s*<div id="trazo-legal"[^>]*>.*?</div>',
              '',
              text,
              count=1,
              flags=re.I | re.S,
          )
          if removed != 1:
              raise SystemExit('No se pudo retirar el bloque temporal duplicado.')

          new_author = '<div>Desarrollo independiente © 2026 Emmanuel Elizondo para la Secretaría de Educación Jalisco. Uso educativo gratuito y no comercial.</div>'
          new_geo = '<div>Made with <a href="https://www.geogebra.org/" target="_blank" rel="noopener noreferrer" style="color:var(--accent);text-decoration:underline;font-weight:600;"><strong>GeoGebra®</strong></a>. GeoGebra es una marca de GeoGebra GmbH.</div>'

          text = text.replace(old_author, new_author, 1)
          text = text.replace(old_geo, new_geo, 1)

          checks = {
              'título': 'Trazo · Herramienta educativa interactiva',
              'autoría': 'Desarrollo independiente © 2026 Emmanuel Elizondo para la Secretaría de Educación Jalisco. Uso educativo gratuito y no comercial.',
              'GeoGebra': 'Made with <a href="https://www.geogebra.org/"',
              'GeoGebra negritas': '<strong>GeoGebra®</strong>',
              'motor': 'Trazo utiliza GeoGebra como motor matemático interactivo. Las construcciones, consignas, organización pedagógica, interfaz y contenidos originales de Trazo son independientes de GeoGebra. No se comercializa esta aplicación ni se cobra por su acceso.'
          }
          for label, needle in checks.items():
              count = text.count(needle)
              if count != 1:
                  raise SystemExit(f'Validación final de {label}: se esperó 1 aparición y hubo {count}.')

          if 'id="trazo-legal"' in text:
              raise SystemExit('Persistió el bloque temporal duplicado.')
          if old_author in text:
              raise SystemExit('Persistió la autoría anterior.')

          path.write_text(text, encoding='utf-8', newline='')
          print('Footer final de Trazo integrado y validado sin duplicados.')
          PY

      - name: Revisar cambio
        shell: bash
        run: |
          git diff --numstat -- trazo-laboratorio.html
          git diff -- trazo-laboratorio.html | head -120

      - name: Guardar en main
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add trazo-laboratorio.html
          git commit -m 'Actualiza leyenda final de Trazo [skip ci]'
          git push origin HEAD:main
