name: Actualizar leyenda inferior de Trazo

on:
  push:
    paths:
      - '.github/workflows/update-trazo-legend.yml'
      - '.trazo-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar-leyenda:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verificar archivo original
        shell: bash
        run: |
          test "$(git hash-object trazo-laboratorio.html)" = "8c6cff21c0f9ad20e0bd95242323dbe874fac412"
          test "$(wc -c < trazo-laboratorio.html | tr -d ' ')" = "1288615"

      - name: Insertar leyenda legal en Trazo
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('trazo-laboratorio.html')
          original = path.read_bytes()
          text = original.decode('utf-8')
          eol = '\r\n' if text.count('\r\n') > text.count('\n') / 2 else '\n'

          block = '''
          <div id="trazo-legal" style="max-width:1100px;margin:22px auto 8px;padding:20px 24px 28px;border-top:1px solid rgba(127,127,127,.28);font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:1.6;color:inherit;text-align:center;opacity:.82;">
            <p style="margin:0 0 8px;"><strong>Trazo · Herramienta educativa interactiva</strong></p>
            <p style="margin:0 0 8px;">Desarrollo independiente © 2026 Emmanuel Elizondo para la Secretaría de Educación Jalisco. Uso educativo gratuito y no comercial.</p>
            <p style="margin:0 0 8px;">Made with <a href="https://www.geogebra.org/" target="_blank" rel="noopener noreferrer" style="color:inherit;text-decoration:underline;"><strong>GeoGebra®</strong></a>. GeoGebra es una marca de GeoGebra GmbH.</p>
            <p style="margin:0;">Trazo utiliza GeoGebra como motor matemático interactivo. Las construcciones, consignas, organización pedagógica, interfaz y contenidos originales de Trazo son independientes de GeoGebra. No se comercializa esta aplicación ni se cobra por su acceso.</p>
          </div>
          '''.strip().replace('\n', eol)

          if 'id="trazo-legal"' in text:
              raise SystemExit('La leyenda ya existe; se detiene para evitar duplicados.')

          footers = list(re.finditer(r'</footer\s*>', text, flags=re.I))
          if footers:
              pos = footers[-1].start()
          else:
              bodies = list(re.finditer(r'</body\s*>', text, flags=re.I))
              if not bodies:
                  raise SystemExit('No se encontró footer ni cierre body; no se modifica el archivo.')
              pos = bodies[-1].start()

          updated = text[:pos] + eol + block + eol + text[pos:]
          updated_bytes = updated.encode('utf-8')

          if len(updated_bytes) != 1289656:
              raise SystemExit(f'Tamaño inesperado tras el parche: {len(updated_bytes)} bytes.')
          if updated.count('id="trazo-legal"') != 1:
              raise SystemExit('La leyenda no quedó insertada exactamente una vez.')

          path.write_bytes(updated_bytes)
          print(f'Leyenda insertada. Bytes: {len(original)} -> {len(updated_bytes)}')
          PY

      - name: Confirmar cambio
        shell: bash
        run: |
          grep -Fq 'Trazo · Herramienta educativa interactiva' trazo-laboratorio.html
          grep -Fq 'Desarrollo independiente © 2026 Emmanuel Elizondo para la Secretaría de Educación Jalisco.' trazo-laboratorio.html
          grep -Fq 'https://www.geogebra.org/' trazo-laboratorio.html
          grep -Fq 'Trazo utiliza GeoGebra como motor matemático interactivo.' trazo-laboratorio.html
          echo 'Cambio detectado:'
          git diff --numstat -- trazo-laboratorio.html

      - name: Guardar en main
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add trazo-laboratorio.html
          git commit -m 'Actualiza leyenda legal de Trazo [skip ci]'
          git push origin HEAD:main
