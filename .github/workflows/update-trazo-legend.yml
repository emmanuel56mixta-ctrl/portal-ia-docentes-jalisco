name: Diagnosticar footer de Trazo

on:
  push:
    paths:
      - '.github/workflows/update-trazo-legend.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostico-footer:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Mostrar contexto exacto del footer
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('trazo-laboratorio.html').read_text(encoding='utf-8')
          needles = [
              'Trazo · Herramienta educativa interactiva',
              'Desarrollo independiente © 2026 Emmanuel Elizondo',
              'Made with <a href="https://www.geogebra.org/"',
              'id="trazo-legal"'
          ]
          for needle in needles:
              print('\n===', needle, '===')
              print('COUNT:', text.count(needle))
              start = 0
              while True:
                  pos = text.find(needle, start)
                  if pos < 0:
                      break
                  lo = max(0, pos - 320)
                  hi = min(len(text), pos + len(needle) + 420)
                  print(repr(text[lo:hi]))
                  start = pos + 1
          PY
