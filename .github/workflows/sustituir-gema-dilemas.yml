name: Sustituir enlace de Dilemas que forman

on:
  push:
    paths:
      - .github/workflows/sustituir-gema-dilemas.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar-enlace:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sustituir enlace de la Gema
        shell: python
        run: |
          from pathlib import Path

          path = Path('formacion-caracter-v2.html')
          old = 'https://gemini.google.com/gem/1RQIkcoeNSN-61wwrokikXbcDFQN6-2Uc?usp=sharing'
          new = 'https://gemini.google.com/gem/1BvOmHR34sWy7bhA95yUTrZHE_VrOhSDv?usp=sharing'

          content = path.read_text(encoding='utf-8')
          if old not in content:
              raise SystemExit('No se encontró el enlace anterior en formacion-caracter-v2.html')

          path.write_text(content.replace(old, new, 1), encoding='utf-8')

      - name: Publicar cambio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add formacion-caracter-v2.html
          git commit -m "fix: actualizar Gema Dilemas que forman"
          git push
